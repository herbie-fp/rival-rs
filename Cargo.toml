[package]
name = "rival3"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Real Computation via Interval Arithmetic"
repository = "https://github.com/herbie-fp/rival3"
readme = "README.md"

exclude = ["infra/*", "rival3-racket/*"]

[lib]
name = "rival"
path = "src/lib.rs"

[[bin]]
name = "rival-cli"
path = "src/bin/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:ascii_table"]

[dependencies]
rug = { version = "1.28", features = ["float"] }
gmp-mpfr-sys = "1.6"
indexmap = "2.12"
# TODO: remove
itertools = "0.14.0"
thiserror = "1"
ascii_table = { version = "4.0", optional = true }

[profile.release]
lto = true
